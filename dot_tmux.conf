# ══════════════════════════════════════════════════════════════════════
#  tmux.conf — Brian / Downstairs (WSL2 + Windows Terminal)
#
#  Model:  session per repo  ·  window per git worktree  ·  2 agent panes
#  Prefix is unchanged (C-b). Windows are numbered from 1.
# ══════════════════════════════════════════════════════════════════════

# ── Terminal ──────────────────────────────────────────────────────────
set  -g default-terminal "tmux-256color"
# 24-bit colour in Windows Terminal.
# `set -as` APPENDS, so a bare append grows this list on every reload and
# `%if` cannot guard it (terminal-features is an array option and expands
# to empty in a format). The first `set -g` RESETS the array; the appends
# then rebuild it, so any number of reloads leaves exactly one of each.
set  -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title"
set -ag terminal-features "screen*:title"
set -ag terminal-features "rxvt*:ignorefkeys"
set -ag terminal-features "*:RGB"
set  -g history-limit 50000                 # agents scroll a lot

# Windows and panes numbered from 1 — matches the number-key row, so
# prefix+1 is the first window. base-index applies to NEW windows only
# (`move-window -r` renumbers existing); pane-base-index is positional and
# applies immediately. renumber-windows closes the gap left by a kill.
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g focus-events on
set  -g mouse on

# ── Window naming ─────────────────────────────────────────────────────
# Names are PINNED to the worktree. Claude's own title is shown on the
# pane border and as status glyphs instead, so the name never moves
# under you — with 30+ worktrees, "which tree is this" is the fact you
# most need and the one you can least afford to have drift.
set -g automatic-rename off
set -g allow-rename off

# ── Claude state, one dot per pane ────────────────────────────────────
# @claude_state is written per-pane by ~/.claude/hooks/tmux-claude-state.sh
# Read it as a traffic light for YOUR attention, not for the agent:
#     working  red    ●   busy — leave it alone
#     blocked  amber  ●   stopped on a prompt — needs a keystroke NOW
#     done     green  ●   turn over, your move
#     ?        grey   ●   claude is running but has published NO state
#     -        dim    ·   pane isn't running claude
#
# ALL states are the same dot; only the colour changes. Mixed shapes
# (✳, ◌) overlap their neighbours here: ● and · are East-Asian
# *Ambiguous* width, so the terminal may draw them wider than one cell
# and a glyph with any extra ink collides with the one beside it.
#
# The leading space is INSIDE the glyph. #{P:...} concatenates its
# results with no separator, so without it the per-pane dots render as
# "●●" — touching each other and the window name.
#
# The pane_current_command test comes FIRST so a stale option left by a
# crashed agent can never render as a live "working".
# `waiting` is BLUE: the turn ended but a background shell or subagent it
# started is still running, so the agent will wake itself and needs nothing
# from you. Green is reserved for "the ball is genuinely in your court".
# `done` is matched EXPLICITLY and unknown gets its own grey dot. Before,
# `done` was the else-branch, so an unset or unrecognised state rendered
# green — a booting or hook-less agent was indistinguishable from a
# finished one, and "finished" is the one state you don't go look at.
# (No commas inside #[...] styles — tmux would parse them as the
#  conditional's argument separator.)
set -g @pane_state_glyph " #{?#{m:*claude*,#{pane_current_command}},#{?#{==:#{@claude_state},blocked},#[fg=colour214]●#[default],#{?#{==:#{@claude_state},working},#[fg=colour203]●#[default],#{?#{==:#{@claude_state},done},#[fg=colour76]●#[default],#{?#{==:#{@claude_state},waiting},#[fg=colour39]●#[default],#[fg=colour248]●#[default]}}}},#[fg=colour240]·#[default]}"

# The outer terminal's tab title is plain text: tmux hands the expanded
# string straight to the terminal, so `#[fg=...]` would show up in the tab
# as literal "#[fg=colour203]". Emoji carry their own colour, so the tab
# gets the same red/amber/green vocabulary without any style codes.
# Non-claude panes emit NOTHING here — a tab is too narrow to spend on them.
# Each dot carries a TRAILING space: two adjacent full-width emoji (🔴🔴)
# render as one wide blob and you cannot count the panes.
set -g @pane_state_emoji "#{?#{m:*claude*,#{pane_current_command}},#{?#{==:#{@claude_state},blocked},🟡 ,#{?#{==:#{@claude_state},working},🔴 ,#{?#{==:#{@claude_state},done},🟢 ,#{?#{==:#{@claude_state},waiting},🔵 ,⚪ }}}},}"

set -g window-status-format         "#I:#W #{P:#{E:@pane_state_glyph}}"
set -g window-status-current-format "#I:#W #{P:#{E:@pane_state_glyph}}"
set -g window-status-separator      "   "

# ── Status bar ────────────────────────────────────────────────────────
set -g status-interval 1
set -g status-left  "#[fg=brightwhite][#S]#[default] "
set -g status-left-length 24
set -g status-right "%l:%M%p"
set -g status-style "bg=black fg=default"
set -g window-status-current-style "fg=magenta"

# ── Pane borders ──────────────────────────────────────────────────────
# The cwd is on the border on purpose: a stray `cd` out of a worktree
# becomes visible instead of silent.
# NOTE: borders were fg=black on a black background before — which would
# have made these titles invisible.
set -g pane-border-status top
# Claude prefixes its own pane title with a spinner glyph (`✳ <task>`).
# U+2733 is East-Asian *Narrow*, so the terminal budgets it ONE cell — but
# Windows Terminal draws it as a colour emoji occupying TWO, so it bleeds
# over the space after it and collides with the task text. Strip it: the
# coloured dot already says the state, and says it better (✳ is identical
# whether the agent is working or idle).
set -g pane-border-format " #{pane_index}#{E:@pane_state_glyph} #[fg=yellow]#{b:pane_current_path}#[default] │ #{s/^[✳◐◓◑◒✻✽◕◔] *//:pane_title} "
set -g pane-border-style        "fg=colour240"
set -g pane-active-border-style "fg=colour45"

# ── Outer Windows Terminal tab ────────────────────────────────────────
set -g set-titles on
# Dots lead so they survive the tab being truncated from the right, and
# #{P:...} covers EVERY pane in the window — the tab still tells you what
# the other pane is doing while you are looking at this one.
set -g set-titles-string "#{P:#{E:@pane_state_emoji}}#{session_name} ▸ #{s/^[✳◐◓◑◒✻✽◕◔] *//:pane_title}"

# ── Keys ──────────────────────────────────────────────────────────────
# prefix+W  worktree menu     prefix+R  reload this file
# (lowercase r is left alone — it is tmux's built-in refresh-client)
bind W run-shell "~/bin/wt menu '#{pane_id}'"
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Mouse wheel scrolling (unchanged)
bind-key -T root WheelUpPane   if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

# ── Plugins — TPM must be the LAST thing in this file ─────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── Session persistence (resurrect + continuum) ───────────────────────
# THE DIVISION OF LABOUR, because it is the whole trap:
#   resurrect  = the save/restore MECHANISM. Binds prefix+C-s / prefix+C-r.
#                It never saves on its own — only when asked.
#   continuum  = the CLOCK that asks. With no continuum there is no
#                automatic save at all, and prefix+C-s is the only thing
#                that ever writes a file.
#
# Declaring @plugin is NOT installing. This conf listed continuum from
# 2026-09-04 while ~/.tmux/plugins held only tpm and resurrect, so the save
# timer was never armed and @continuum-restore below was inert. When the
# reboot took the server there was no file to restore because no save had
# ever run — ~/.tmux/resurrect/ did not exist. After ANY @plugin edit:
# prefix+I.
#
# Assert the MECHANISM, not the setting. Continuum arms itself by prepending
# a #(...continuum_save.sh) interpolation to status-right; if that string is
# absent, auto-save is off no matter what these options say:
#     tmux show-options -gv status-right | grep -c continuum_save   # want 1
# Note it re-runs every status-interval (1s here) — the script exits early
# until the interval below has elapsed.
set -g @continuum-restore 'on'

# Minutes between automatic saves. Upstream default is 15. A WSL2 reboot
# kills the server with no chance to save, so this number is the exact width
# of the window you lose. 5 is affordable because the capture is 'visible'.
set -g @continuum-save-interval '5'

# Restore the last screenful of each pane, not the full 50k scrollback.
# 'full' (the default once contents are on) re-tars history-limit lines for
# EVERY pane on EVERY save — a window per worktree with two agent panes each
# makes that a large archive rewritten every 5 minutes. 'visible' answers the
# question you actually have on restore ("what was this pane doing") for a
# fraction of the I/O. Flip to 'full' if you ever need the scrollback back.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'

# WHERE THE FILES LIVE — pinned, because "there was no file" and "I looked
# in the wrong directory" are the same symptom. This version of resurrect
# defaults to the XDG path ($XDG_DATA_HOME, else ~/.local/share)/tmux/
# resurrect — NOT the ~/.tmux/resurrect that most of the docs and blog posts
# still name. Both paths are live in the wild; the fork is decided inside
# helpers.sh. Pinning it here means the conf answers the question.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Retention, stated rather than assumed: 30 days, but never fewer than the
# 5 newest. <dir>/last symlinks the newest state file, and pane_contents.tar.gz
# is ONE file overwritten each save, so it cannot grow.
set -g @resurrect-delete-backup-after '30'

# Restore is deliberately SHELL-ONLY. It brings back the sessions, the pinned
# window names, the pane splits and each pane's cwd, then stops. It does not
# relaunch claude: 30+ worktrees would mean dozens of agents starting at once,
# unasked, against branches you have not looked at yet. Restart the ones you
# want by hand. (@resurrect-processes is what would change this.)
#
# Resurrect does not save USER OPTIONS, so @repo and @claude_state come back
# unset: panes render the grey "unknown" dot until a hook fires, and `wt`
# falls back to the pane cwd's git repo — which IS restored. Both already
# handle this; do not add a restore step that leans on either surviving.

run '~/.tmux/plugins/tpm/tpm'
